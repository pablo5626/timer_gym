<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reloj de Gimnasio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&display=swap">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14171c;--mu:#6b7280;--ac:#2563eb;--bd:#dfe3e8;--dg:#dc2626;--fn:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#181c23;--tx:#eef0f3;--mu:#98a1ae;--bd:#2a303a;--ac:#5b8def}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#181c23;--tx:#eef0f3;--mu:#98a1ae;--bd:#2a303a;--ac:#5b8def}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif}
body{min-height:100vh;transition:background .25s}
body.w{background:#b4ff4f}body.r{background:#ef4b3a}body.p{background:#fff35c}body.d{background:#2b2f36}
main{max-width:520px;margin:0 auto;padding:16px}main.pl{max-width:none;padding:0}
h1{font-size:22px;margin:4px 0 14px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);width:100%;font-weight:600;margin-top:10px}
button.dg{color:var(--dg)}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0;box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:6px;align-items:center}.row input{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr 70px;gap:8px;margin-top:10px}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:4px}
.tt{display:flex;align-items:center;gap:3px;color:var(--tx)}.tt input{width:100%;text-align:center}
.grid>label>input{text-align:center}
.big{width:100%;font-size:20px;font-weight:600;margin:6px 0 12px}
.mu{color:var(--mu);font-size:14px}.sp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acts{display:flex;gap:6px;margin-top:10px}.acts button{flex:1;padding:8px 4px;font-size:14px}
.set{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0 14px;align-items:center}.set label{flex-direction:row;align-items:center;color:var(--tx);font-size:14px}
.set input[type=range]{padding:0;width:110px}
/* pantalla de entrenamiento */
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}#fl.on{animation:fl .5s}@keyframes fl{from{opacity:.9}to{opacity:0}}
#play{font-family:var(--fn);color:#0a0a0a;text-transform:uppercase}
body.r #play,body.d #play{color:#fff}
.pw{min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:1fr auto}
.mn{display:flex;flex-direction:column;justify-content:center;text-align:center;padding:14px 16px 0;gap:4px;min-width:0}
.top{display:flex;justify-content:space-between;font-size:22px;font-weight:800;opacity:.8}
.nm{font-size:34px;font-weight:900;line-height:1.05;word-break:break-word}
#tm{font-size:min(36vw,26vh);font-weight:900;line-height:.95;font-variant-numeric:tabular-nums}
#bar{height:10px;background:rgba(0,0,0,.18);border-radius:5px;overflow:hidden;margin:6px 0}#bar i{display:block;height:100%;background:currentColor;width:0}
.up{font-size:22px;font-weight:800;padding:10px;border-radius:10px;background:rgba(0,0,0,.18);margin-bottom:10px}
.up.w{background:#b4ff4f;color:#0a0a0a}.up.r{background:#ef4b3a;color:#fff}.up.p{background:#fff35c;color:#0a0a0a}
.sd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.2);color:#fff}
.sr{text-align:center;line-height:1}.sr small{display:block;font-size:14px;opacity:.8;font-weight:700}.sr b{font-size:56px;font-weight:900}
.ctl{display:flex;gap:8px}
#play button{background:rgba(255,255,255,.2);color:#fff;border:0;font:inherit;font-size:26px;padding:10px 16px;border-radius:12px}
#play button.st{font-size:18px;font-weight:800;background:rgba(0,0,0,.35)}
@media(orientation:landscape) and (max-height:540px){
.pw{grid-template-rows:none;grid-template-columns:1fr 170px}
.sd{flex-direction:column;justify-content:center;padding:10px}
.ctl{flex-wrap:wrap;justify-content:center}
#tm{font-size:min(34vh,26vw)}.nm{font-size:26px}.top{font-size:18px}.up{font-size:18px;padding:6px}}
</style></head><body>
<div id="fl"></div>
<main>
<section id="list"></section>
<section id="edit" hidden></section>
<section id="hist" hidden></section>
<section id="play" hidden></section>
</main>
<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const f2=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
let db={routines:[],set:{},hist:[]};
try{const d=JSON.parse(localStorage.getItem('gt1'));if(d&&d.routines)db=d}catch(e){}
db.set=Object.assign({sound:true,voice:true,flash:true,vol:60},db.set);db.hist=db.hist||[];
if(!db.routines.length)db.routines=[{id:uid(),name:'Ejemplo: Pecho',ex:[{n:'Press de banca',w:90,r:30,s:3},{n:'Aperturas',w:130,r:10,s:2}]}];
const save=()=>{try{localStorage.setItem('gt1',JSON.stringify(db))}catch(e){}};
const total=r=>r.ex.reduce((a,e)=>a+(e.w+e.r)*e.s,0);
let cur=null,P=null,ac=null,wl=null;

function show(v){['list','edit','hist','play'].forEach(x=>$('#'+x).hidden=x!==v);$('main').classList.toggle('pl',v==='play');if(v!=='play')document.body.className='';window.scrollTo(0,0)}
const lock=()=>{try{navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&P)lock()});

/* sonido, voz, destello */
function beep(f,d){if(!db.set.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.35*db.set.vol/100;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function say(t){if(!db.set.voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.volume=db.set.vol/100;speechSynthesis.speak(u)}catch(e){}}
function flash(){if(!db.set.flash)return;const f=$('#fl');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}

/* lista */
function renderList(){
$('#list').innerHTML=`<div class="sp"><h1>🏋️ Mis rutinas</h1><button data-a="hist">📜 Historial</button></div>
<div class="set"><label><input type="checkbox" data-s="sound" ${db.set.sound?'checked':''}> Sonido</label><label><input type="checkbox" data-s="voice" ${db.set.voice?'checked':''}> Voz</label><label><input type="checkbox" data-s="flash" ${db.set.flash?'checked':''}> Destello</label><label>Volumen <input type="range" data-s="vol" min="0" max="100" value="${db.set.vol}"></label></div>
${db.routines.map(r=>`<div class="card"><div class="sp"><b>${esc(r.name)}</b><span class="mu">${r.ex.length} ej. · ${fmt(total(r))}</span></div>
<div class="acts"><button data-a="go" data-id="${r.id}">▶ Iniciar</button><button data-a="ed" data-id="${r.id}">Editar</button><button data-a="dup" data-id="${r.id}">Copiar</button><button class="dg" data-a="rm" data-id="${r.id}">✕</button></div></div>`).join('')}
<button class="pri" data-a="new">+ Nueva rutina</button>`}
$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const r=db.routines.find(x=>x.id===b.dataset.id),a=b.dataset.a;
if(a==='hist'){renderHist();show('hist')}
else if(a==='new'){const n={id:uid(),name:'Nueva rutina',ex:[{n:'Ejercicio 1',w:60,r:30,s:3}]};db.routines.push(n);save();openEdit(n.id)}
else if(a==='ed')openEdit(r.id);
else if(a==='go')start(r);
else if(a==='dup'){db.routines.push(JSON.parse(JSON.stringify({...r,id:uid(),name:r.name+' (copia)'})));save();renderList()}
else if(a==='rm'&&confirm('¿Borrar “'+r.name+'”?')){db.routines=db.routines.filter(x=>x!==r);save();renderList()}});
$('#list').addEventListener('input',e=>{const k=e.target.dataset.s;if(k){db.set[k]=e.target.type==='checkbox'?e.target.checked:+e.target.value;save()}});
$('#list').addEventListener('change',e=>{if(e.target.dataset.s==='vol'){beep(880,.15);say('Volumen')}});

/* historial */
function renderHist(){$('#hist').innerHTML=`<button data-a="back">‹ Rutinas</button><h1>Historial</h1>
${db.hist.length?db.hist.map(h=>`<div class="card sp"><div><b>${esc(h.n)}</b><div class="mu">${new Date(h.t).toLocaleString('es-CO',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div><b>${fmt(h.d)}</b></div>`).join('')+'<button class="dg" data-a="clr">Borrar historial</button>':'<p class="mu">Aún no has terminado ninguna rutina.</p>'}`}
$('#hist').addEventListener('click',e=>{const a=e.target.closest('[data-a]')?.dataset.a;
if(a==='back'){renderList();show('list')}else if(a==='clr'&&confirm('¿Borrar todo el historial?')){db.hist=[];save();renderHist()}});

/* editor */
function openEdit(id){cur=db.routines.find(r=>r.id===id);renderEdit();show('edit')}
function renderEdit(){
const t=(f,v)=>`<span class="tt"><input data-f="${f}m" type="number" inputmode="numeric" min="0" value="${Math.floor(v/60)}">:<input data-f="${f}s" type="number" inputmode="numeric" min="0" max="59" value="${v%60}"></span>`;
$('#edit').innerHTML=`<button data-a="back">‹ Rutinas</button>
<input id="rn" class="big" value="${esc(cur.name)}">
${cur.ex.map((e,i)=>`<div class="card" data-i="${i}"><div class="row"><input data-f="n" value="${esc(e.n)}" placeholder="Ejercicio"><button data-a="up">↑</button><button data-a="dn">↓</button><button data-a="cp">⧉</button><button class="dg" data-a="del">✕</button></div>
<div class="grid"><label>Trabajo (min:seg)${t('w',e.w)}</label><label>Descanso (min:seg)${t('r',e.r)}</label><label>Series<input data-f="s" type="number" inputmode="numeric" min="1" value="${e.s}"></label></div></div>`).join('')}
<button data-a="add" style="width:100%">+ Ejercicio</button>
<p class="mu" id="tot"></p>
<button class="pri" data-a="play">▶ Iniciar rutina</button>`;tot()}
const tot=()=>{const t=$('#tot');if(t)t.textContent='Duración total: '+fmt(total(cur))};
$('#edit').addEventListener('input',e=>{
if(e.target.id==='rn'){cur.name=e.target.value;save();return}
const c=e.target.closest('[data-i]');if(!c)return;const x=cur.ex[c.dataset.i],q=f=>+c.querySelector(`[data-f="${f}"]`).value||0;
x.n=c.querySelector('[data-f="n"]').value;x.w=q('wm')*60+q('ws');x.r=q('rm')*60+q('rs');x.s=Math.max(1,Math.floor(q('s')));save();tot()});
$('#edit').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,c=b.closest('[data-i]'),i=c?+c.dataset.i:-1,L=cur.ex;
if(a==='back'){renderList();show('list');return}
if(a==='play'){start(cur);return}
if(a==='add')L.push({n:'Ejercicio '+(L.length+1),w:60,r:30,s:1});
else if(a==='cp')L.splice(i+1,0,{...L[i]});
else if(a==='del'&&L.length>1)L.splice(i,1);
else if(a==='up'&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];
else if(a==='dn'&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];
save();renderEdit()});

/* reproductor */
function build(r){const st=[{t:'p',n:'Prepárate',d:5,first:r.ex[0].n}];
r.ex.forEach((e,i)=>{for(let k=1;k<=e.s;k++){if(e.w>0)st.push({t:'w',n:e.n,d:e.w,k,K:e.s,i,N:r.ex.length});if(e.r>0)st.push({t:'r',n:e.n,d:e.r,k,K:e.s,i,N:r.ex.length})}});
while(st.length&&st[st.length-1].t==='r')st.pop();return st}
function start(r){if(P)clearInterval(P.iv);const steps=build(r);let a=0;const cum=steps.map(s=>{const c=a;if(s.t!=='p')a+=s.d;return c});
P={r,steps,cum,tot:a,idx:-1,paused:false};
beep(1,.01);say(' ');lock();show('play');go(0);P.iv=setInterval(tick,200)}
const lbl={p:'PREPÁRATE',w:'TRABAJO',r:'DESCANSO'};
function spoken(d){const m=Math.floor(d/60),s=d%60;return (m?m+(m===1?' minuto':' minutos'):'')+(m&&s?' y ':'')+(s?s+' segundos':'')}
function go(i,q){
if(i>=P.steps.length)return finish();
i=Math.max(0,i);P.idx=i;const s=P.steps[i],n=P.steps[i+1];P.end=Date.now()+s.d*1000;P.last=s.d;P.paused=false;
document.body.className=s.t;
$('#play').innerHTML=`<div class="pw"><div class="mn">
<div class="top"><span id="el">00:00 / ${f2(P.tot)}</span><span>${lbl[s.t]}</span></div>
<div class="nm">${esc(s.t==='p'?s.first:s.n)}</div><div id="tm">${f2(s.d)}</div><div id="bar"><i></i></div>
<div class="up ${n?n.t:''}">${n?'SIGUE · '+lbl[n.t]+' · '+esc(n.t==='p'?'':n.n)+(n.t==='w'?' ('+n.k+'/'+n.K+')':''):'ÚLTIMO BLOQUE'}</div></div>
<div class="sd"><div class="sr"><small>SERIE</small><b>${s.t==='p'?'–':s.k+'/'+s.K}</b><small>${s.t==='p'?'':'EJERCICIO '+(s.i+1)+'/'+s.N}</small></div>
<div class="ctl"><button data-a="prev">⏮</button><button data-a="pp" id="pp">⏸</button><button data-a="nxt">⏭</button></div>
<button class="st" data-a="stop">Terminar</button></div></div>`;
if(q)return;flash();
if(s.t==='p')say('Prepárate. Empezamos con '+s.first);
else if(s.t==='w'){beep(990,.3);say(s.n+'.'+(s.K>1?' Serie '+s.k+' de '+s.K+'.':'')+' '+spoken(s.d))}
else{beep(500,.3);const w=P.steps.slice(i+1).find(x=>x.t==='w');say('Descanso, '+spoken(s.d)+(w&&w.i!==s.i?'. Sigue '+w.n:''))}}
function tick(){if(!P||P.paused)return;const ms=P.end-Date.now(),s=P.steps[P.idx];
if(ms<=0){const ov=-ms;go(P.idx+1,ov>1500);if(P&&ov>0)P.end-=ov;return}
const left=Math.ceil(ms/1000);if(left!==P.last){P.last=left;if(left<=3)beep(660,.12)}
const t=$('#tm'),b=$('#bar i'),el=$('#el');if(t)t.textContent=f2(left);if(b)b.style.width=(100-ms/(s.d*10))+'%';
if(el)el.textContent=f2(s.t==='p'?0:P.cum[P.idx]+s.d-left)+' / '+f2(P.tot)}
function finish(){clearInterval(P.iv);db.hist.unshift({n:P.r.name,t:Date.now(),d:P.tot});db.hist=db.hist.slice(0,100);save();P=null;try{wl&&wl.release()}catch(e){}
document.body.className='d';beep(990,.5);flash();say('Rutina terminada. Buen trabajo');
$('#play').innerHTML=`<div class="pw"><div class="mn"><div class="nm">✅ ¡Rutina terminada!</div><div class="top" style="justify-content:center">BUEN TRABAJO</div></div><div class="sd" style="justify-content:center"><button class="st" data-a="stop">Volver</button></div></div>`}
$('#play').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
if(a==='stop'){if(P){clearInterval(P.iv);P=null}try{wl&&wl.release()}catch(e){}try{speechSynthesis.cancel()}catch(e){}renderList();show('list');return}
if(!P)return;
if(a==='nxt')go(P.idx+1);
else if(a==='prev')go(P.idx-1);
else if(a==='pp'){if(P.paused){P.end=Date.now()+P.rem;P.paused=false;b.textContent='⏸'}else{P.rem=P.end-Date.now();P.paused=true;b.textContent='▶'}}});
renderList();
</script></body></html>
